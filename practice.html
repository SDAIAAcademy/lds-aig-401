<section>
<h2>الانطلاقة: موجز الإستديو، والتشخيص، ونموذج التشغيل</h2>
<ol>
<li><p>مشارك يخطط عناصر ملفه للوزارة. أي هذه العناصر يدخل الملف كما يطلبه الإستديو؟</p><ul><li><b>أ.</b> تقييم أثر كامل لنظام ترشيح الاحتيال وحده</li><li><b>ب.</b> خطة استثمار لمحفظة الذكاء الاصطناعي بعوائدها</li><li><b>ج.</b> اختصاصات اللجنة ونصابها وقواعد التصعيد</li><li><b>د.</b> صياغة كل بنود معيار الوكلاء بأفعال إلزامية</li></ul></li>
<li><p>وكالة التوظيف (U4) تريد أن تثبت أن بُعد السجل والبيانات في المستوى 3. أي دليل يكفي؟</p><ul><li><b>أ.</b> مطابقة السجل باستبيان الموظفين: تغطية 92%، ولكل نظام مالك</li><li><b>ب.</b> إجراء تسجيل للأنظمة اعتمده وكيل الوزارة هذا العام</li><li><b>ج.</b> تعهد مكتوب من مديري الإدارات بأن كل أنظمتهم مسجلة</li><li><b>د.</b> زيادة عدد الأنظمة في السجل من 7 إلى 11 خلال عام</li></ul></li>
<li><p>في وحدة موازية: موظف واحد بحصة 70% من 1,400 ساعة، والطلب 900 ساعة، والقرارات تتأخر. أي تغيير يخفض الاستغلال إلى 75% أو أقل دون أن يضعف الاستقلال أو التغطية؟</p><ul><li><b>أ.</b> إعفاء كل الأنظمة المتوسطة من المراجعة</li><li><b>ب.</b> أن يراجع كل مالك نظامه بنفسه</li><li><b>ج.</b> أن ترسل الوحدات طلباتها مجمعة مرة في الشهر</li><li><b>د.</b> سفير بحصة 30% يتولى المسار الخفيف فقط</li></ul></li>
</ol>
</section>
<section>
<h2>مراجعة المرحلة 1: التشخيص والميثاق، ثم السياسات والبوابات</h2>
<ol>
<li><p>تشخيص مشارك مرتب بقاعدة معلنة وكل مستوى فيه بسجل، ونموذجه مبني على الطلب والقدرة. لكن ميثاقه لا يقول من يقبل الخطر المرتفع، وفي صف الاستثناءات يقترح المكتب ويعتمد. ما القرار؟</p><ul><li><b>أ.</b> يُقبل كما هو، فالتشخيص والنموذج قويان والميثاق يكفي للبناء عليه</li><li><b>ب.</b> يُقبل بشروط: سطر القبول والتصعيد، وفصل الأدوار في الاستثناءات</li><li><b>ج.</b> يُعاد كاملًا، فالميثاق ناقص ولا يُبنى عليه شيء في المرحلة 2</li><li><b>د.</b> يُقبل، وتحكم لجنة المناقشة في الميثاق لاحقًا في الأسبوع 8</li></ul></li>
<li><p>موظف في وكالة التوظيف (U4) بنى أداة تلخص بمساعد توليدي إعلانات معارض التوظيف المنشورة على موقع الوزارة في نشرة أسبوعية. البيانات «عام»، ولا تمس قرارًا عن أحد. ماذا يقرر المكتب؟</p><ul><li><b>أ.</b> لا تسجيل، فهي أداة شخصية لا نظام للوكالة</li><li><b>ب.</b> T2، فكل أداة توليدية تحتاج مراجعة المكتب</li><li><b>ج.</b> T1 في المسار الخفيف، ومالكها مدير صاحبها</li><li><b>د.</b> تتوقف عند G0 حتى تُراجع بياناتها</li></ul></li>
</ol>
</section>
<section>
<h2>مراجعة المرحلة 2: البوابات على خمسة أنظمة، ثم اللجان والقياس</h2>
<ol>
<li><p>مشارك يعرض بواباته على خمسة أنظمة، ويقول إن متوسط زمن القرار تسعة أيام، أي ضمن مستوى العشرة. ما الذي يطلبه الموجّه قبل أن يقبل؟</p><ul><li><b>أ.</b> استبيانًا لرضا مقدمي الطلبات عن سرعة البوابات</li><li><b>ب.</b> عشرة أنظمة بدل خمسة حتى يكون المتوسط أدق</li><li><b>ج.</b> رفع مستوى الخدمة إلى خمسة عشر يومًا ليكون أكثر واقعية</li><li><b>د.</b> زمن كل طلب بأيام العمل، مقارنًا بمستوى فئته الصحيحة</li></ul></li>
<li><p>لجنة في جهة أخرى لها تسعة مصوّتين ونصاب ستة. حضر سبعة، ثم تنحى ثلاثة لتعارض المصالح في ملف عاجل. ماذا يفعل الرئيس؟</p><ul><li><b>أ.</b> لا قرار: يؤجل، أو يعمم إن أتاحت الاختصاصات ذلك</li><li><b>ب.</b> يصدر القرار، فالحاضرون سبعة والنصاب ستة</li><li><b>ج.</b> يقرر الأربعة، فالملف عاجل، ويُكتب ذلك في المحضر</li><li><b>د.</b> يصوّت المتنحون بعد أن يُكتب إفصاحهم في المحضر</li></ul></li>
<li><p>مكتب الحوكمة في وكالة التوظيف (U4) يختار مقياسًا واحدًا لتقريره الربعي. أيها يقيس الفاعلية؟</p><ul><li><b>أ.</b> نسبة المراجعات المنجزة من الطلبات الواردة في الربع</li><li><b>ب.</b> نسبة حوادث المطابقة المكتشفة بالمراقبة قبل الشكاوى</li><li><b>ج.</b> نسبة الموظفين الذين حضروا ساعة تدريب واحدة على الأقل</li><li><b>د.</b> نسبة اجتماعات اللجنة المنعقدة في موعدها خلال الربع</li></ul></li>
</ol>
</section>
<section>
<h2>مراجعة المرحلة 3: اللجنة والمقاييس والموارد وخارطة الطريق</h2>
<ol>
<li><p>بعد شكوى المطابقة في U4، يقول أربعة مشاركين ما يتغير في برامجهم. أي استجابة تستعمل البرنامج المصمم؟</p><ul><li><b>أ.</b> مراجعة G4 للمطابقة الآن، ثم مقياس للفروق بين الفئات العمرية</li><li><b>ب.</b> يوقف كل أنظمة الوزارة التي تقرر في شأن أفراد حتى تُراجع جميعها</li><li><b>ج.</b> تُنشأ لجنة خاصة للعدالة في المطابقة ترفع إلى الوزير مباشرة</li><li><b>د.</b> يصدر المكتب بيانًا عن التزام الوزارة بالعدالة، ويراقب الشكاوى</li></ul></li>
</ol>
</section>
<section>
<h2>أسئلة أخرى</h2>
<ol>
<li><p>هيئة نقل افتراضية تقول إن سجل أنظمتها في المستوى 3 من نموذج نضج يطلب الدليل. أي دليل يثبت ذلك؟</p><ul><li><b>أ.</b> إجراء تسجيل للأنظمة اعتمده الرئيس التنفيذي للهيئة منذ عامين ونُشر على البوابة الداخلية</li><li><b>ب.</b> مطابقة السجل بفواتير الاشتراكات: 93% مسجلة، ولكل منها مالك</li><li><b>ج.</b> إقرار مديري الإدارات بأن أنظمتهم كلها مسجلة</li><li><b>د.</b> ارتفاع عدد الأنظمة المسجلة هذا العام من 40 نظامًا إلى 65 نظامًا</li></ul></li>
<li><p>في جهة موازية ثغرتان: أداة توليدية تعالج بيانات «مقيد» (تخالف سياسة نافذة، وزنها 3، والتعرض متوسط 2)، ونظام بلا مراجعة سنوية (يخالف قاعدة داخلية، وزنها 1، والتعرض مرتفع 3). بقاعدة «الوزن × التعرض»، أيهما أعلى؟</p><ul><li><b>أ.</b> النظام بلا مراجعة، فتعرضه مرتفع</li><li><b>ب.</b> تتساويان، فكلتاهما ثغرة واحدة</li><li><b>ج.</b> لا تُرتبان قبل تقييم أثر كامل لكل نظام</li><li><b>د.</b> الأداة التوليدية: 6 مقابل 3</li></ul></li>
<li><p>لجنة حوكمة في جهة موازية نظرت في 40 بندًا خلال عام ووافقت عليها كلها دون شروط، ولم يُسجل رأي مخالف، ونال البند نحو خمس دقائق. ماذا تكتب في التشخيص؟</p><ul><li><b>أ.</b> علامات إشراف شكلي تحتاج دليلًا آخر قبل الحكم: متى يصل البند إلى اللجنة، وما الذي تغير بعد قراراتها</li><li><b>ب.</b> اللجنة فعالة، فالفرق تحضّر ملفاتها جيدًا</li><li><b>ج.</b> اللجنة غير لازمة وتُلغى</li><li><b>د.</b> المشكلة في قلة الأعضاء</li></ul></li>
<li><p>مشروع سياسة الذكاء الاصطناعي المسؤول المنشور على منصة «استطلاع» يُعامل في ترتيب الثغرات كأنه نظام نافذ، لأنه صادر عن سدايا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي، المستوى 16 وحده «كارثي».</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>وحدة موازية فيها منسق بحصة 50% من 1,400 ساعة للمراجعة، والطلب 630 ساعة. ما الاستغلال، وهل هو ضمن هدف 75%؟</p><ul><li><b>أ.</b> 90%، فوق الهدف</li><li><b>ب.</b> 45%، ضمن الهدف</li><li><b>ج.</b> 111%، والطلب أكبر من القدرة</li><li><b>د.</b> 75%، على الحد تمامًا</li></ul></li>
<li><p>في مصفوفة صلاحيات موازية: قائد مكتب الحوكمة يصوغ سياسة الوكلاء ويعتمدها، والتدقيق الداخلي يتحقق منها. ما الخلل؟</p><ul><li><b>أ.</b> التدقيق الداخلي لا يتحقق من السياسات</li><li><b>ب.</b> السياسة يجب أن يصوغها الوزير</li><li><b>ج.</b> الصائغ هو المعتمِد، فلا فصل بين المهام</li><li><b>د.</b> لا خلل ما دام هناك تحقق لاحق</li></ul></li>
<li><p>جهة موازية لها ثماني وحدات، لثلاث منها فرق بيانات قوية والباقي بلا خبرة، وفيها أنظمة عالية الخطر في كل الوحدات. أي نموذج تشغيل أنسب لها؟</p><ul><li><b>أ.</b> اتحادي: تراجع كل وحدة من الوحدات الثماني أنظمتها بنفسها وبمعاييرها</li><li><b>ب.</b> المحور والأطراف: محور للعالي وسفراء للخفيف</li><li><b>ج.</b> لا حوكمة حتى تُبنى الخبرة في كل الوحدات</li><li><b>د.</b> مركزي بموظف واحد لكل الأنظمة</li></ul></li>
<li><p>في مبادئ أخلاقيات الذكاء الاصطناعي، «مقيّم نظام الذكاء الاصطناعي» أحد الأدوار التي تسميها الجهة، ومسؤوليته تدقيق الأنظمة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>الميثاق الجيد يعيد كتابة سياسة الخصوصية وسياسة الأمن داخله حتى يكون مكتفيًا بذاته.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>طلب موازٍ: مساعد توليدي يلخص محاضر اجتماعات داخلية مصنفة «مقيد». الاحتمالية 1 والأثر 2. ماذا تقرر البوابة الأولى في مسودة مثل مسودة المقرر؟</p><ul><li><b>أ.</b> مسار خفيف بحكم المستوى 2</li><li><b>ب.</b> يُرفع إلى اللجنة، فهو توليدي</li><li><b>ج.</b> يُمنح استثناء 90 يومًا بضوابط بديلة يعتمدها قائد المكتب</li><li><b>د.</b> يتوقف حتى تُحوَّل البيانات إلى «عام»</li></ul></li>
<li><p>طلب موازٍ من الفئة T2 (مستوى خدمة 10 أيام عمل) قُدّم مكتملًا يوم الأحد وصدر قراره يوم الخميس بعد أسبوع ونصف: 9 أيام عمل. ثم انتظر الاجتماع الشهري للجنة ستة أيام عمل أخرى. ما الحكم؟</p><ul><li><b>أ.</b> ضمن المستوى: 9 أيام عمل من اكتمال الطلب إلى القرار</li><li><b>ب.</b> ضمن المستوى، فاللجنة لا تُحسب</li><li><b>ج.</b> خارج المستوى: 15 يومًا</li><li><b>د.</b> لا يُحكم دون ساعات العمل الفعلية</li></ul></li>
<li><p>وكيل موازٍ يحجز مواعيد المقابلات ويستطيع إلغاء موعد شخص إذا لم يرد خلال يومين. مستواه بالمصفوفة 4. أي فئة يأخذ في مسودة مثل مسودة المقرر؟</p><ul><li><b>أ.</b> T3: وكيل يغيّر حالة ملف شخص</li><li><b>ب.</b> T2 بحكم المستوى 4</li><li><b>ج.</b> T1، فهو تجريبي</li><li><b>د.</b> لا فئة له قبل أن يُسمى مسؤوله</li></ul></li>
<li><p>يجوز أن يعتمد صاحب الطلب الاستثناء الذي طلبه إذا كان مديرًا للوحدة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مستوى السياسة يقول لماذا ومن، ومستوى المعيار يقول ماذا بمتطلبات قابلة للقياس، ومستوى الإجراء يقول كيف.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>لجنة موازية لها 9 أعضاء مصوّتين ونصابها 6. في ملف ما غاب عضو وتنحى اثنان لتعارض المصالح. هل يصدر قرار؟</p><ul><li><b>أ.</b> نعم: يبقى 6، وهو النصاب</li><li><b>ب.</b> لا: يبقى 5</li><li><b>ج.</b> لا: المتنحون يُحسبون غيابًا مضاعفًا</li><li><b>د.</b> نعم: النصاب يُحسب في بداية الاجتماع فقط</li></ul></li>
<li><p>في اجتماع موازٍ اعترض ممثل الخط الأمامي على توسيع نظام، وصدر القرار بالأغلبية. ماذا يكتب المحضر؟</p><ul><li><b>أ.</b> القرار وحده، حفاظًا على وحدة اللجنة</li><li><b>ب.</b> أن القرار بالتوافق</li><li><b>ج.</b> القرار وأسبابه، والرأي المخالف وأسبابه بالدور</li><li><b>د.</b> اسم المعترض الشخصي ورقم وظيفته لتحميله المسؤولية عن القرار</li></ul></li>
<li><p>ملف موازٍ: خطر متبقٍ مستواه 16 بعد الضوابط، ومالك النظام يطلب من اللجنة قبوله. ماذا تفعل اللجنة؟</p><ul><li><b>أ.</b> تقبله بشروط ومراجعة بعد ثلاثة أشهر</li><li><b>ب.</b> تؤجله حتى يتحسن</li><li><b>ج.</b> ترفضه نهائيًا وتأمر بإيقاف النظام فورًا</li><li><b>د.</b> ترفع توصيتها ولا تقرر</li></ul></li>
<li><p>إذا لم يكتمل النصاب في ملف عاجل، يجوز أن يصدر الرئيس القرار وحده ثم يُعرض على اللجنة لاحقًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي هذه مقياس فاعلية لا مقياس نشاط في برنامج حوكمة؟</p><ul><li><b>أ.</b> عدد المراجعات المنجزة في الربع</li><li><b>ب.</b> عدد الموظفين الذين أنهوا التوعية</li><li><b>ج.</b> نسبة الحوادث المكتشفة بالمراقبة</li><li><b>د.</b> عدد السياسات والمعايير والإجراءات المعتمدة في السنة</li></ul></li>
<li><p>برنامج موازٍ يتوقع 2,100 ساعة مراجعة في السنة. بافتراض 1,400 ساعة إنتاجية للموظف واستغلال مستهدف 75%، كم موظفًا يلزم؟</p><ul><li><b>أ.</b> 1.5</li><li><b>ب.</b> 2.8</li><li><b>ج.</b> 2.0</li><li><b>د.</b> 1.1</li></ul></li>
<li><p>مكتب حوكمة في جهة موازية يطلب من الإدارة العليا موظفَين إضافيين. أي دليل يسند الطلب أكثر؟</p><ul><li><b>أ.</b> عدد الاجتماعات التي حضرها المكتب هذا العام وعدد المحاضر</li><li><b>ب.</b> الطلب المتوقع بالساعات بحسب الفئة مقابل القدرة</li><li><b>ج.</b> مقارنة بعدد موظفي مكاتب الحوكمة في جهات أكبر حجمًا</li><li><b>د.</b> شكوى الموظفين من ضغط العمل في استبيان داخلي</li></ul></li>
<li><p>إذا صار «عدد المراجعات المنجزة» هدفًا للمكتب، فقد يدفعه إلى مراجعات أسرع وأقل عمقًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في مناقشة موازية طرحت اللجنة حدثًا: «جهة رقابية تطلب تسجيل كل الوكلاء خلال 60 يومًا». أي جواب يعالج الحدث؟</p><ul><li><b>أ.</b> البرنامج يغطي ذلك ولا تغيير</li><li><b>ب.</b> نعيد تصميم البرنامج من البداية</li><li><b>ج.</b> سنرفع الحدث إلى الوزير</li><li><b>د.</b> ما يتغير في خارطة الطريق: تقديم التسجيل الشامل للوكلاء من الشهر 6 إلى الشهر 2، ومن يتولاه، وما يتأخر بسببه</li></ul></li>
<li><p>أي عنصر يجب أن يكون في خارطة طريق لمدة 18 شهرًا لبرنامج حوكمة؟</p><ul><li><b>أ.</b> قائمة الأنظمة كلها بأسمائها التقنية</li><li><b>ب.</b> محطات بمواعيد ومالكين ومقاييس</li><li><b>ج.</b> نص كل سياسة</li><li><b>د.</b> السيرة المهنية لأعضاء اللجنة ومؤهلاتهم وخبراتهم السابقة</li></ul></li>
<li><p>في الدفاع عن ملف صيغ بالذكاء الاصطناعي، يكفي أن يقول المشارك إن المساعد اقترح هذا العنصر.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مذكرة التعديلات بعد المناقشة تذكر ما تغير في البرنامج بسبب الحدث الجديد، ولماذا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
